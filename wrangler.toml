name = "arunesh-sharma-portfolio"
compatibility_date = "2024-11-01"

# Cloudflare Workers - Static Assets (NOT Cloudflare Pages)
# Workflow: npm run build -> dist/ -> wrangler deploy -> Workers Static Assets
# Compatible with installed wrangler@3.114.x
# Docs: https://developers.cloudflare.com/workers/static-assets/

[assets]
directory = "./dist"
not_found_handling = "single-page-application"
